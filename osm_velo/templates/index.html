<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OSM-Velo QGIS</title>
    </head>
    <body>
        <h3>OSM-Velo: Upload a route:</h3>

        <form method="POST" action="/upload" enctype="multipart/form-data">

            <input
                type="file"
                name="fit_file"
                accept=".fit"
                required
            >

            <button type="submit">
                Upload FIT file
            </button>
            
        </form>

    </body>
</html>
